pipeline:
  identifier: Build_Ganga_dhar_python_harness_demo_1791016177306
  name: Build python-harness-demo
  orgIdentifier: default
  projectIdentifier: PythonHarnessDemo
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1791009970988
        repoName: Ganga-dhar/python-harness-demo
  stages:
    - stage:
        identifier: build
        name: build
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          execution:
            steps:
              - step:
                  identifier: setupvirtualenvironment
                  name: setup virtual environment
                  type: Run
                  timeout: ""
                  spec:
                    command: |-
                      set -e

                      echo "Creating Python virtual environment..."

                      python3 -m venv .venv

                      . .venv/bin/activate

                      echo "Upgrading pip..."

                      python3 -m pip install --upgrade pip

                      echo "Installing dependencies..."

                      python3 -m pip install -r requirements.txt

                      echo "Python environment ready."
              - step:
                  identifier: runlinter
                  name: run linter
                  type: Run
                  timeout: ""
                  spec:
                    command: |-
                      set -e

                      echo "Running Flake8..."

                      . .venv/bin/activate

                      flake8 . --exclude=venv,.venv

                      echo "Flake8 passed."
              - step:
                  identifier: runtests
                  name: run tests
                  type: Run
                  timeout: ""
                  spec:
                    command: |-
                      set -e

                      echo "Running Python unit tests..."

                      . .venv/bin/activate

                      pytest -v

                      echo "All tests passed."
              - step:
                  identifier: dockerbuildandpush
                  name: Docker Build and Push to ECR
                  type: BuildAndPushDockerRegistry
                  timeout: 20m
                  spec:
                    connectorRef: AWSConnector
                    repo: 730335304128.dkr.ecr.us-east-1.amazonaws.com/python-harness-demo
                    tags:
                      - latest
                      - <+pipeline.sequenceId>
                    dockerfile: Dockerfile
                    context: .
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
