pipeline:
  identifier: Build_Ganga_dhar_python_harness_demo_1791016177306
  name: Build python-harness-demo
  orgIdentifier: default
  projectIdentifier: PythonHarnessDemo
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1791009970988
        repoName: Ganga-dhar/python-harness-demo
  stages:
    - stage:
        identifier: build
        name: build
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
          execution:
            steps:
              - step:
                  identifier: setupvirtualenvironment
                  name: setup virtual environment
                  type: Run
                  timeout: ""
                  spec:
                    command: |-
                      set -e

                      python3 -m venv .venv

                      . .venv/bin/activate

                      python3 -m pip install --upgrade pip

                      python3 -m pip install -r requirements.txt
              - step:
                  identifier: runlinter
                  name: run linter
                  type: Run
                  timeout: ""
                  spec:
                    command: |-
                      set -e

                      . .venv/bin/activate

                      flake8 . --exclude=venv,.venv
              - step:
                  identifier: runtests
                  name: run tests
                  type: Run
                  timeout: ""
                  spec:
                    command: |-
                      set -e

                      . .venv/bin/activate

                      pytest -v
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
